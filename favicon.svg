<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Ivory Background Gradient -->
    <radialGradient id="favBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#F3EAD9"/>
    </radialGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DC"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA8222"/>
      <stop offset="100%" stop-color="#F2DF99"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#544116" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners & Gold Border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5"/>

  <!-- Intertwined Gold Wedding Rings -->
  <g filter="url(#favShadow)" stroke="url(#favGold)" stroke-width="5" fill="none">
    <!-- Left Ring -->
    <circle cx="40" cy="55" r="21"/>
    <!-- Right Ring -->
    <circle cx="60" cy="55" r="21"/>
    <!-- Diamond Gem on Right Ring -->
    <path d="M60,26 L65,33 L60,38 L55,33 Z" fill="url(#favGold)" stroke="none"/>
    <polygon points="60,24 63,29 60,34 57,29" fill="#FFFFFF" stroke="none"/>
  </g>

  <!-- Sparkle Particle -->
  <polygon points="60,18 61.5,21.5 65,23 61.5,24.5 60,28 58.5,24.5 55,23 58.5,21.5" fill="#FFF5D6"/>
</svg>
