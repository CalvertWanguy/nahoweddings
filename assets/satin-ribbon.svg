<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Satin Gradient Front -->
    <linearGradient id="satinGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="20%" stop-color="#FAF0DF"/>
      <stop offset="45%" stop-color="#D6B889"/>
      <stop offset="65%" stop-color="#FDF8EF"/>
      <stop offset="85%" stop-color="#C5A064"/>
      <stop offset="100%" stop-color="#EADABF"/>
    </linearGradient>

    <!-- Satin Gradient Back Shadow -->
    <linearGradient id="satinGradBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C7B47"/>
      <stop offset="50%" stop-color="#BCA070"/>
      <stop offset="100%" stop-color="#806232"/>
    </linearGradient>

    <!-- Ribbon Soft Shadow -->
    <filter id="ribbonShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4A3B22" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#ribbonShadow)">
    <!-- Back Folds (Darker shade creating 3D depth) -->
    <path d="M 0,160 Q 150,220 300,160 T 600,140 Q 750,80 1000,120 L 1000,160 Q 750,120 600,180 T 300,200 Q 150,260 0,200 Z" fill="url(#satinGradBack)" opacity="0.6"/>

    <!-- Main Front Ribbon Wave -->
    <path d="M -20,120 
             C 120,40 240,210 420,150 
             C 600,90 720,220 880,130 
             C 940,95 980,110 1020,125 
             L 1020,185 
             C 970,170 930,155 870,185 
             C 700,270 580,140 400,205 
             C 220,270 100,100 -20,175 Z" 
          fill="url(#satinGradFront)"/>

    <!-- Satin Sheen Highlights -->
    <path d="M 40,110 C 130,55 220,180 380,145 C 320,170 200,160 40,110 Z" fill="#FFFFFF" opacity="0.45"/>
    <path d="M 680,115 C 750,140 820,150 890,135 C 830,175 740,180 680,115 Z" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
