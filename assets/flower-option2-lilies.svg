<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lilyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#E5D8C5"/>
    </radialGradient>
    <linearGradient id="goldStem2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#4E3B21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g class="bouquet-lilies" filter="url(#shadow2)">
    <!-- Gold Vines -->
    <path d="M 280,260 Q 120,120 60,80" stroke="url(#goldStem2)" stroke-width="2" fill="none"/>
    <path d="M 280,260 Q 440,120 520,80" stroke="url(#goldStem2)" stroke-width="2" fill="none"/>
    <path d="M 280,260 Q 420,400 500,480" stroke="url(#goldStem2)" stroke-width="2" fill="none"/>

    <!-- Starburst White Lily Petals -->
    <g class="lily-petals">
      <!-- 6 Pointed Star Lily Petals -->
      <path d="M 280,260 C 260,120 230,40 280,20 C 330,40 300,120 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
      <path d="M 280,260 C 380,140 480,120 510,170 C 480,210 380,220 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
      <path d="M 280,260 C 380,320 480,410 440,460 C 380,440 340,340 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
      <path d="M 280,260 C 260,400 230,480 280,500 C 330,480 300,400 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
      <path d="M 280,260 C 180,320 80,410 120,460 C 180,440 220,340 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
      <path d="M 280,260 C 180,140 80,120 50,170 C 80,210 180,220 280,260 Z" fill="url(#lilyGrad)" stroke="#E5D8C5" stroke-width="0.8"/>
    </g>

    <!-- Lily Center Pistil & Long Anthers -->
    <g class="anthers" stroke="url(#goldStem2)" stroke-width="2" fill="#D4AF37">
      <line x1="280" y1="260" x2="280" y2="180"/>
      <ellipse cx="280" cy="175" rx="6" ry="3"/>

      <line x1="280" y1="260" x2="340" y2="210"/>
      <ellipse cx="345" cy="205" rx="3" ry="6"/>

      <line x1="280" y1="260" x2="340" y2="300"/>
      <ellipse cx="345" cy="305" rx="6" ry="3"/>

      <line x1="280" y1="260" x2="220" y2="300"/>
      <ellipse cx="215" cy="305" rx="6" ry="3"/>

      <line x1="280" y1="260" x2="220" y2="210"/>
      <ellipse cx="215" cy="205" rx="3" ry="6"/>
    </g>
  </g>
</svg>
