<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="magGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FBF7F0"/>
      <stop offset="90%" stop-color="#EFE6D8"/>
      <stop offset="100%" stop-color="#DDD0BA"/>
    </radialGradient>

    <radialGradient id="centerGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </radialGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5D3C1"/>
      <stop offset="50%" stop-color="#8E9F88"/>
      <stop offset="100%" stop-color="#5C6D56"/>
    </linearGradient>

    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#4E3B21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g class="magnolia-jasmine-bouquet" filter="url(#softShadow)">
    
    <!-- ELEGANT BOTANICAL LEAVES & GOLD VINES -->
    <g class="foliage">
      <path d="M 300,300 Q 140,160 80,100 C 60,80 140,80 180,120 Z" fill="url(#leafGrad)"/>
      <path d="M 300,300 Q 460,160 520,100 C 540,80 460,80 420,120 Z" fill="url(#leafGrad)"/>
      <path d="M 300,300 Q 460,440 520,500 C 540,520 460,520 420,480 Z" fill="url(#leafGrad)"/>
      <path d="M 300,300 Q 140,440 80,500 C 60,520 140,520 180,480 Z" fill="url(#leafGrad)"/>

      <!-- Gold Leaves -->
      <path d="M 300,300 Q 420,200 530,190" fill="none" stroke="url(#goldStem)" stroke-width="2.2"/>
      <path d="M 530,190 C 510,170 540,175 545,195 Z" fill="url(#goldStem)"/>
      <path d="M 460,205 C 440,185 470,190 475,210 Z" fill="url(#goldStem)"/>
    </g>

    <!-- MAGNOLIA BLOSSOM (Soft Creamy Layers) -->
    <g class="magnolia-flower">
      <!-- Back Petals -->
      <path d="M 300,300 C 180,150 140,50 300,30 C 460,50 420,150 300,300 Z" fill="url(#magGrad)" stroke="#E5D9C7" stroke-width="0.8"/>
      <path d="M 300,300 C 450,180 550,140 570,300 C 550,460 450,420 300,300 Z" fill="url(#magGrad)" stroke="#E5D9C7" stroke-width="0.8"/>
      <path d="M 300,300 C 420,450 460,550 300,570 C 140,550 180,450 300,300 Z" fill="url(#magGrad)" stroke="#E5D9C7" stroke-width="0.8"/>
      <path d="M 300,300 C 150,420 50,460 30,300 C 50,140 150,180 300,300 Z" fill="url(#magGrad)" stroke="#E5D9C7" stroke-width="0.8"/>

      <!-- Mid Cup Petals -->
      <path d="M 300,300 C 200,180 220,100 300,80 C 380,100 400,180 300,300 Z" fill="#FFFFFF"/>
      <path d="M 300,300 C 420,200 500,220 520,300 C 500,380 420,400 300,300 Z" fill="url(#magGrad)"/>
      <path d="M 300,300 C 380,400 380,500 300,520 C 220,500 220,400 300,300 Z" fill="#FFFFFF"/>
      <path d="M 300,300 C 180,400 100,380 80,300 C 100,220 180,200 300,300 Z" fill="url(#magGrad)"/>

      <!-- Center Gold Crown & Stamens -->
      <circle cx="300" cy="300" r="32" fill="url(#centerGoldGlow)"/>
      <circle cx="300" cy="300" r="20" fill="#6E521C"/>
      
      <!-- Stamen Ring -->
      <circle cx="280" cy="280" r="3.5" fill="#FFF3D1"/>
      <circle cx="320" cy="280" r="3.5" fill="#FFF3D1"/>
      <circle cx="320" cy="320" r="3.5" fill="#FFF3D1"/>
      <circle cx="280" cy="320" r="3.5" fill="#FFF3D1"/>
      <circle cx="300" cy="275" r="3.5" fill="#FFF3D1"/>
      <circle cx="325" cy="300" r="3.5" fill="#FFF3D1"/>
      <circle cx="300" cy="325" r="3.5" fill="#FFF3D1"/>
      <circle cx="275" cy="300" r="3.5" fill="#FFF3D1"/>
    </g>
  </g>
</svg>
