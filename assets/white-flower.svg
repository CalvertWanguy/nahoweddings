<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Petal Gradients -->
    <radialGradient id="petalGrad1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#FAF5EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EFE6D8" stop-opacity="0.75"/>
    </radialGradient>

    <radialGradient id="petalGrad2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#F7F0E6" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#E5D9C7" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Gold Center Gradient -->
    <radialGradient id="goldCenter" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="30%" stop-color="#E5C378"/>
      <stop offset="70%" stop-color="#B89343"/>
      <stop offset="100%" stop-color="#7A5A1B"/>
    </radialGradient>

    <!-- Gold Stamen Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Layer Petals -->
  <g class="outer-petals">
    <!-- Top Petal -->
    <path d="M250,250 C230,120 180,50 250,30 C320,50 270,120 250,250 Z" fill="url(#petalGrad1)" opacity="0.95"/>
    <!-- Top Right Petal -->
    <path d="M250,250 C340,150 420,110 440,180 C440,260 340,240 250,250 Z" fill="url(#petalGrad2)" opacity="0.92"/>
    <!-- Bottom Right Petal -->
    <path d="M250,250 C360,270 430,340 400,410 C330,440 290,340 250,250 Z" fill="url(#petalGrad1)" opacity="0.95"/>
    <!-- Bottom Petal -->
    <path d="M250,250 C280,370 300,450 240,470 C180,460 210,370 250,250 Z" fill="url(#petalGrad2)" opacity="0.93"/>
    <!-- Bottom Left Petal -->
    <path d="M250,250 C160,350 80,420 50,360 C40,290 150,270 250,250 Z" fill="url(#petalGrad1)" opacity="0.94"/>
    <!-- Top Left Petal -->
    <path d="M250,250 C140,220 60,140 100,70 C160,50 200,160 250,250 Z" fill="url(#petalGrad2)" opacity="0.91"/>
  </g>

  <!-- Inner Layer Petals -->
  <g class="inner-petals" opacity="0.96">
    <path d="M250,250 C200,140 280,100 250,250 Z" fill="url(#petalGrad1)"/>
    <path d="M250,250 C330,190 340,270 250,250 Z" fill="url(#petalGrad2)"/>
    <path d="M250,250 C300,330 220,340 250,250 Z" fill="url(#petalGrad1)"/>
    <path d="M250,250 C180,310 160,220 250,250 Z" fill="url(#petalGrad2)"/>
  </g>

  <!-- Delicate Petal Veins -->
  <g stroke="#D4C3AD" stroke-width="0.75" opacity="0.35" fill="none">
    <path d="M250,250 C245,150 240,80 250,40"/>
    <path d="M250,250 C310,190 380,150 420,170"/>
    <path d="M250,250 C310,290 370,360 380,400"/>
    <path d="M250,250 C240,330 220,400 235,450"/>
    <path d="M250,250 C180,290 110,340 70,340"/>
    <path d="M250,250 C180,190 120,120 120,80"/>
  </g>

  <!-- Flower Center Pistil / Pistils Ring -->
  <circle cx="250" cy="250" r="38" fill="url(#goldCenter)" filter="url(#goldGlow)"/>
  <circle cx="250" cy="250" r="28" fill="#5C4518" opacity="0.8"/>
  <circle cx="250" cy="250" r="20" fill="#3D2D0F"/>

  <!-- Golden Stamens & Anthers -->
  <g fill="#FAD980" stroke="#B89343" stroke-width="0.8">
    <!-- Ring of stamens -->
    <!-- Angle offsets around center -->
    <circle cx="250" cy="210" r="3.5"/>
    <line x1="250" y1="230" x2="250" y2="213" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="278" cy="218" r="3.5"/>
    <line x1="264" y1="236" x2="276" y2="220" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="290" cy="245" r="3.5"/>
    <line x1="270" y1="248" x2="287" y2="246" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="282" cy="275" r="3.5"/>
    <line x1="265" y1="261" x2="280" y2="273" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="255" cy="292" r="3.5"/>
    <line x1="252" y1="268" x2="254" y2="289" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="225" cy="288" r="3.5"/>
    <line x1="238" y1="265" x2="227" y2="285" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="210" cy="262" r="3.5"/>
    <line x1="232" y1="254" x2="212" y2="261" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="212" cy="230" r="3.5"/>
    <line x1="234" y1="241" x2="214" y2="232" stroke="#D4AF37" stroke-width="1.2"/>
    <circle cx="230" cy="214" r="3.5"/>
    <line x1="242" y1="233" x2="232" y2="216" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Additional outer dust stamens -->
    <circle cx="265" cy="202" r="2.5" fill="#FFEAA7"/>
    <circle cx="295" cy="230" r="2.5" fill="#FFEAA7"/>
    <circle cx="298" cy="260" r="2.5" fill="#FFEAA7"/>
    <circle cx="270" cy="295" r="2.5" fill="#FFEAA7"/>
    <circle cx="238" cy="300" r="2.5" fill="#FFEAA7"/>
    <circle cx="202" cy="275" r="2.5" fill="#FFEAA7"/>
    <circle cx="198" cy="245" r="2.5" fill="#FFEAA7"/>
    <circle cx="215" cy="218" r="2.5" fill="#FFEAA7"/>
  </g>

  <!-- Sparkle Particles around center -->
  <g fill="#FFF5D6" opacity="0.9">
    <polygon points="250,190 252,195 257,197 252,199 250,204 248,199 243,197 248,195"/>
    <polygon points="310,240 312,243 315,245 312,247 310,250 308,247 305,245 308,243"/>
    <polygon points="200,280 202,283 205,285 202,287 200,290 198,287 195,285 198,283"/>
  </g>
</svg>
