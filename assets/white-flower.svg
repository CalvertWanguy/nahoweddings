<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Petal Gradient (Ultra Soft White & Champagne Cream) -->
    <radialGradient id="roseCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FAF6F0"/>
      <stop offset="85%" stop-color="#EFE5D6"/>
      <stop offset="100%" stop-color="#DECDB5"/>
    </radialGradient>

    <radialGradient id="peonyPetal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5ECE0"/>
      <stop offset="100%" stop-color="#E5D6C0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </linearGradient>

    <!-- Soft Green Leaf Gradient -->
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C4B4"/>
      <stop offset="50%" stop-color="#8D9C88"/>
      <stop offset="100%" stop-color="#647360"/>
    </linearGradient>

    <!-- Shadow Filter for Realistic Flower Layers -->
    <filter id="flowerSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#4E3B21" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g class="blooming-bouquet" filter="url(#flowerSoftShadow)">
    
    <!-- BACKGROUND BOTANICAL LEAVES & STEMS -->
    <g class="leaves">
      <!-- Sage Green Leaves Top -->
      <path d="M 280,240 Q 200,100 140,60 C 120,40 180,60 210,100 Z" fill="url(#sageLeaf)"/>
      <path d="M 280,240 Q 360,100 440,70 C 460,50 400,70 360,110 Z" fill="url(#sageLeaf)"/>
      
      <!-- Gold Foil Sprigs -->
      <path d="M 280,240 Q 420,180 520,160" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
      <path d="M 520,160 C 500,140 530,145 535,165 Z" fill="url(#goldAccent)"/>
      <path d="M 460,175 C 440,155 470,160 475,180 Z" fill="url(#goldAccent)"/>
      
      <!-- Bottom Leaf Cluster -->
      <path d="M 280,240 Q 140,360 80,440 C 60,460 120,440 160,390 Z" fill="url(#sageLeaf)"/>
      <path d="M 280,240 Q 380,380 440,480 C 460,500 420,450 370,400 Z" fill="url(#sageLeaf)"/>
    </g>

    <!-- FLOWER HEAD 2: TOP RIGHT BLOOMING PEONY / ROSE BUD -->
    <g class="secondary-flower" transform="translate(130, -60) scale(0.65)">
      <circle cx="280" cy="240" r="90" fill="url(#peonyPetal)"/>
      <path d="M 280,150 C 220,160 210,240 280,240 Z" fill="url(#roseCore)"/>
      <path d="M 280,150 C 340,160 350,240 280,240 Z" fill="url(#roseCore)"/>
      <path d="M 210,220 C 230,300 330,300 350,220 Z" fill="url(#peonyPetal)"/>
    </g>

    <!-- FLOWER HEAD 1: MAIN FULL-BLOOM GARDEN ROSE (Lush & Petal-Rich) -->
    <g class="main-flower">
      <!-- Outer Petals Ring -->
      <path d="M 280,80 C 160,80 120,200 160,300 C 200,400 360,400 400,300 C 440,200 400,80 280,80 Z" fill="url(#roseCore)" opacity="0.98"/>
      
      <!-- Mid Petal Layers -->
      <path d="M 280,110 C 190,110 160,200 200,280 C 240,360 320,360 360,280 C 400,200 370,110 280,110 Z" fill="url(#peonyPetal)"/>
      
      <!-- Petal Flaps (Layered Curving Petals) -->
      <path d="M 280,110 C 180,180 200,320 280,340 Q 360,260 280,110 Z" fill="url(#roseCore)"/>
      <path d="M 280,110 C 380,180 360,320 280,340 Q 200,260 280,110 Z" fill="url(#peonyPetal)"/>
      <path d="M 170,220 C 220,350 340,350 390,220 Q 280,310 170,220 Z" fill="url(#roseCore)"/>
      <path d="M 190,160 C 280,240 370,160 280,300 Q 190,220 190,160 Z" fill="url(#peonyPetal)"/>

      <!-- Rose Heart Cup Spiral -->
      <path d="M 280,180 C 230,190 230,270 280,280 C 330,270 330,190 280,180 Z" fill="#FAF1E4"/>
      <path d="M 280,195 C 245,200 245,255 280,260 C 315,255 315,200 280,195 Z" fill="#EFE0CB"/>
      <path d="M 280,210 C 260,210 260,245 280,250 C 300,245 300,210 280,210 Z" fill="#E0C9AA"/>

      <!-- Delicate Gold Petal Edgings -->
      <path d="M 180,160 C 280,110 380,160 380,160" fill="none" stroke="url(#goldAccent)" stroke-width="1.2" opacity="0.6"/>
      <path d="M 160,250 C 280,350 400,250 400,250" fill="none" stroke="url(#goldAccent)" stroke-width="1.2" opacity="0.6"/>
    </g>

    <!-- FLOWER HEAD 3: BOTTOM LEFT OPENING ROSEBUD -->
    <g class="flower-bud" transform="translate(-80, 140) scale(0.55)">
      <path d="M 280,160 C 220,180 200,280 280,320 C 360,280 340,180 280,160 Z" fill="url(#peonyPetal)"/>
      <path d="M 240,200 C 220,240 340,240 320,200 Z" fill="url(#roseCore)"/>
      <!-- Green Sepals wrapping bud -->
      <path d="M 280,320 Q 220,260 210,200 Q 260,280 280,320 Z" fill="url(#sageLeaf)"/>
      <path d="M 280,320 Q 340,260 350,200 Q 300,280 280,320 Z" fill="url(#sageLeaf)"/>
    </g>

    <!-- GOLD DUST PARTICLES -->
    <g fill="url(#goldAccent)">
      <circle cx="120" cy="120" r="3.5"/>
      <circle cx="480" cy="380" r="4"/>
      <circle cx="500" cy="140" r="3"/>
      <circle cx="100" cy="360" r="3"/>
    </g>

  </g>
</svg>
