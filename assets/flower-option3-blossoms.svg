<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="blossomGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FCF6ED"/>
      <stop offset="100%" stop-color="#EEDEC9"/>
    </radialGradient>
    <linearGradient id="goldStem3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#4E3B21" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g class="blossom-garland" filter="url(#shadow3)">
    <!-- Elegant Gold Branch Curve -->
    <path d="M 100,50 Q 250,220 480,480" stroke="url(#goldStem3)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 220,180 Q 350,120 450,140" stroke="url(#goldStem3)" stroke-width="2" fill="none"/>
    <path d="M 320,320 Q 220,400 150,420" stroke="url(#goldStem3)" stroke-width="2" fill="none"/>

    <!-- Flower 1 Center Bloom -->
    <g transform="translate(250, 220)">
      <circle cx="0" cy="-35" r="24" fill="url(#blossomGrad)"/>
      <circle cx="33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#C5A059"/>
    </g>

    <!-- Flower 2 Top Right Bloom -->
    <g transform="translate(380, 130) scale(0.8)">
      <circle cx="0" cy="-35" r="24" fill="url(#blossomGrad)"/>
      <circle cx="33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#C5A059"/>
    </g>

    <!-- Flower 3 Bottom Left Bloom -->
    <g transform="translate(180, 380) scale(0.75)">
      <circle cx="0" cy="-35" r="24" fill="url(#blossomGrad)"/>
      <circle cx="33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-20" cy="30" r="24" fill="url(#blossomGrad)"/>
      <circle cx="-33" cy="-10" r="24" fill="url(#blossomGrad)"/>
      <circle cx="0" cy="0" r="10" fill="#C5A059"/>
    </g>

    <!-- Floating Rose Petals & Gold Dots -->
    <path d="M 450,280 C 470,260 490,290 460,310 Z" fill="url(#blossomGrad)"/>
    <path d="M 120,250 C 140,230 160,260 130,280 Z" fill="url(#blossomGrad)"/>
    <circle cx="490" cy="220" r="4" fill="#C5A059"/>
    <circle cx="100" cy="340" r="3.5" fill="#C5A059"/>
  </g>
</svg>
