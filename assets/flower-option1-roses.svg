<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="roseCore1" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FAF5EE"/>
      <stop offset="85%" stop-color="#EFE3D3"/>
      <stop offset="100%" stop-color="#D9C7AC"/>
    </radialGradient>
    <radialGradient id="goldCore1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </radialGradient>
    <linearGradient id="goldStem1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B7"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8C6A1D"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2CEBE"/>
      <stop offset="50%" stop-color="#8E9E8A"/>
      <stop offset="100%" stop-color="#5B6C57"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#4E3B21" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g class="bouquet-roses" filter="url(#shadow1)">
    <!-- Foliage Leaves -->
    <path d="M 280,250 Q 150,100 100,50 C 80,30 160,50 190,90 Z" fill="url(#leafGrad1)"/>
    <path d="M 280,250 Q 380,100 460,50 C 480,30 420,50 380,100 Z" fill="url(#leafGrad1)"/>
    <path d="M 280,250 Q 420,380 500,450 C 520,470 440,460 380,400 Z" fill="url(#leafGrad1)"/>
    <path d="M 280,250 Q 140,380 80,450 C 60,470 120,460 180,400 Z" fill="url(#leafGrad1)"/>

    <!-- Gold Foil Accents -->
    <path d="M 280,250 Q 450,180 530,170" fill="none" stroke="url(#goldStem1)" stroke-width="2.5"/>
    <circle cx="530" cy="170" r="8" fill="url(#goldStem1)"/>
    <circle cx="470" cy="180" r="6" fill="url(#goldStem1)"/>

    <!-- Main Blooming White Rose Head -->
    <g class="rose-flower">
      <circle cx="280" cy="250" r="130" fill="url(#roseCore1)" opacity="0.98"/>
      <!-- Petal Layers -->
      <path d="M 280,120 C 150,150 150,350 280,380 C 410,350 410,150 280,120 Z" fill="#FFFFFF" opacity="0.95"/>
      <path d="M 280,150 C 180,180 180,320 280,350 C 380,320 380,180 280,150 Z" fill="url(#roseCore1)"/>
      <path d="M 280,180 C 210,200 210,300 280,320 C 350,300 350,200 280,180 Z" fill="#FFFFFF"/>
      <!-- Center Gold Stamens -->
      <circle cx="280" cy="250" r="28" fill="url(#goldCore1)"/>
      <circle cx="280" cy="250" r="18" fill="#5C4518"/>
      <!-- Gold Stamen Dust -->
      <circle cx="265" cy="235" r="3" fill="#FFF3D1"/>
      <circle cx="295" cy="235" r="3" fill="#FFF3D1"/>
      <circle cx="295" cy="265" r="3" fill="#FFF3D1"/>
      <circle cx="265" cy="265" r="3" fill="#FFF3D1"/>
    </g>
  </g>
</svg>
