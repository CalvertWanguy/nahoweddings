<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="wmGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="1"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8C6A1D" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <g stroke="url(#wmGoldGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Grand Floral Wedding Arch -->
    <path d="M 60,380 C 60,100 540,100 540,380" stroke-width="3" stroke-dasharray="8 4"/>
    <path d="M 85,390 C 85,130 515,130 515,390" stroke-width="2"/>

    <!-- Arch Flowers & Leaf Clusters -->
    <g fill="#C5A059" fill-opacity="0.25" stroke="url(#wmGoldGradient)" stroke-width="1.8">
      <!-- Top Center Crown Flower -->
      <circle cx="300" cy="115" r="18"/>
      <path d="M 280,115 C 270,90 330,90 320,115 Z"/>
      <path d="M 280,115 C 270,140 330,140 320,115 Z"/>
      
      <!-- Left Floral Clusters -->
      <circle cx="180" cy="150" r="14"/>
      <circle cx="115" cy="225" r="14"/>
      <circle cx="75" stroke-width="1.5" cy="310" r="12"/>

      <!-- Right Floral Clusters -->
      <circle cx="420" cy="150" r="14"/>
      <circle cx="485" cy="225" r="14"/>
      <circle cx="525" cy="310" r="12"/>

      <!-- Leaves -->
      <path d="M 220,135 Q 240,120 250,140 Q 230,150 220,135 Z"/>
      <path d="M 380,135 Q 360,120 350,140 Q 370,150 380,135 Z"/>
    </g>

    <!-- Couple Embracing (Bride & Groom Silhouette) -->
    <!-- Groom (Left Silhouette) -->
    <g fill="#C5A059" fill-opacity="0.18" stroke="url(#wmGoldGradient)" stroke-width="2">
      <!-- Groom Head -->
      <circle cx="265" cy="230" r="16"/>
      <!-- Groom Hair / Profile -->
      <path d="M 252,220 C 255,210 270,210 275,222" fill="none"/>
      <!-- Groom Suit / Body -->
      <path d="M 265,246 C 255,270 240,320 235,390 C 230,460 225,560 220,640 L 285,640 C 285,550 280,450 280,390 C 280,330 275,270 265,246 Z"/>
      <!-- Groom Arm Embracing Bride -->
      <path d="M 265,270 Q 290,290 315,295" fill="none" stroke-width="2.5"/>
    </g>

    <!-- Bride (Right Silhouette with Gown & Flowing Veil) -->
    <g fill="#C5A059" fill-opacity="0.18" stroke="url(#wmGoldGradient)" stroke-width="2">
      <!-- Bride Head with Elegant Updo -->
      <circle cx="330" cy="240" r="15"/>
      <circle cx="342" cy="235" r="6"/> <!-- Bun -->

      <!-- Flowing Bridal Veil -->
      <path d="M 335,225 C 385,250 410,360 425,480 C 435,560 445,630 450,680" fill="none" stroke-width="1.8" stroke-dasharray="4 3"/>

      <!-- Wedding Dress Gown & Train -->
      <path d="M 328,255 C 310,290 300,340 285,420 C 270,500 250,580 225,660 L 440,660 C 410,620 380,550 365,470 C 350,390 340,330 332,255 Z"/>
    </g>

    <!-- Romantic Heart Light Watermark behind heads -->
    <path d="M 297,215 C 297,205 285,195 275,205 C 265,215 297,240 297,240 C 297,240 329,215 319,205 C 309,195 297,205 297,215 Z" fill="#C5A059" fill-opacity="0.3" stroke="url(#wmGoldGradient)" stroke-width="1.5"/>

    <!-- Intertwined Gold Wedding Rings with Sparkle Gem -->
    <g transform="translate(300, 750)">
      <circle cx="-20" cy="0" r="34" stroke-width="4" fill="url(#ringGlow)"/>
      <circle cx="20" cy="0" r="34" stroke-width="4" fill="url(#ringGlow)"/>
      <!-- Diamond Gem on Ring -->
      <path d="M 20,-34 L 28,-44 L 20,-52 L 12,-44 Z" fill="url(#wmGoldGradient)"/>
      <!-- Diamond Reflection Rays -->
      <line x1="20" y1="-56" x2="20" y2="-62" stroke-width="2"/>
      <line x1="28" y1="-50" x2="34" y2="-54" stroke-width="2"/>
      <line x1="12" y1="-50" x2="6" y2="-54" stroke-width="2"/>
    </g>

    <!-- Sparkling Wedding Stars & Petals Floating -->
    <g fill="url(#wmGoldGradient)" stroke="none">
      <polygon points="300,50 304,60 314,64 304,68 300,78 296,68 286,64 296,60"/>
      <polygon points="100,450 104,458 112,462 104,466 100,474 96,466 88,462 96,458"/>
      <polygon points="500,450 504,458 512,462 504,466 500,474 496,466 488,462 496,458"/>
      <polygon points="300,540 303,546 309,548 303,550 300,556 297,550 291,548 297,546"/>
      <polygon points="160,780 163,786 169,788 163,790 160,796 157,790 151,788 157,786"/>
      <polygon points="440,780 443,786 449,788 443,790 440,796 437,790 431,788 437,786"/>
    </g>

  </g>
</svg>
