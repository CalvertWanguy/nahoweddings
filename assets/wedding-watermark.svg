<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="wmGoldPale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8C6A1D" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="ringGlowPale" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#wmGoldPale)" stroke-width="1.0" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Grand Floral Wedding Arch (Ultra Pale Thin Lines) -->
    <path d="M 70,380 C 70,110 530,110 530,380" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M 92,390 C 92,140 508,140 508,390" stroke-width="0.8"/>

    <!-- Arch Flowers & Leaf Clusters -->
    <g fill="#C5A059" fill-opacity="0.08" stroke="url(#wmGoldPale)" stroke-width="0.8">
      <!-- Top Center Crown Flower -->
      <circle cx="300" cy="120" r="14"/>
      <path d="M 285,120 C 275,100 325,100 315,120 Z"/>
      
      <!-- Left Floral Clusters -->
      <circle cx="185" cy="155" r="11"/>
      <circle cx="125" cy="225" r="11"/>

      <!-- Right Floral Clusters -->
      <circle cx="415" cy="155" r="11"/>
      <circle cx="475" cy="225" r="11"/>
    </g>

    <!-- Couple Embracing (Bride & Groom Silhouette - Ultra Subtle) -->
    <!-- Groom (Left Silhouette) -->
    <g fill="#C5A059" fill-opacity="0.06" stroke="url(#wmGoldPale)" stroke-width="0.9">
      <!-- Groom Head -->
      <circle cx="268" cy="232" r="14"/>
      <!-- Groom Suit / Body -->
      <path d="M 268,246 C 258,270 245,320 240,390 C 235,460 230,560 225,640 L 285,640 C 285,550 280,450 280,390 C 280,330 276,270 268,246 Z"/>
      <path d="M 268,270 Q 290,290 315,295" fill="none" stroke-width="1.0"/>
    </g>

    <!-- Bride (Right Silhouette with Gown & Flowing Veil) -->
    <g fill="#C5A059" fill-opacity="0.06" stroke="url(#wmGoldPale)" stroke-width="0.9">
      <!-- Bride Head -->
      <circle cx="330" cy="242" r="13"/>
      <!-- Flowing Veil -->
      <path d="M 335,228 C 380,250 405,360 418,480 C 428,560 438,630 442,680" fill="none" stroke-width="0.8" stroke-dasharray="3 3"/>
      <!-- Wedding Dress Gown -->
      <path d="M 328,255 C 310,290 300,340 285,420 C 270,500 250,580 225,660 L 440,660 C 410,620 380,550 365,470 C 350,390 340,330 332,255 Z"/>
    </g>

    <!-- Intertwined Gold Wedding Rings -->
    <g transform="translate(300, 750)">
      <circle cx="-18" cy="0" r="28" stroke-width="1.5" fill="url(#ringGlowPale)"/>
      <circle cx="18" cy="0" r="28" stroke-width="1.5" fill="url(#ringGlowPale)"/>
      <path d="M 18,-28 L 24,-36 L 18,-42 L 12,-36 Z" fill="url(#wmGoldPale)"/>
    </g>

  </g>
</svg>
