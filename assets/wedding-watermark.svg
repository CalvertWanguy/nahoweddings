<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="wmGoldBalanced" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8C6A1D" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="ringGlowBalanced" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3D1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <g stroke="url(#wmGoldBalanced)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Grand Floral Wedding Arch (Crisp, Well-Defined Lines) -->
    <path d="M 62,370 C 62,95 538,95 538,370" stroke-width="2.2" stroke-dasharray="7 3"/>
    <path d="M 86,380 C 86,122 514,122 514,380" stroke-width="1.5"/>

    <!-- Arch Flowers & Leaf Crown -->
    <g fill="#C5A059" fill-opacity="0.18" stroke="url(#wmGoldBalanced)" stroke-width="1.2">
      <circle cx="300" cy="108" r="15"/>
      <path d="M 282,108 C 272,85 328,85 318,108 Z"/>
      <path d="M 282,108 C 272,131 328,131 318,108 Z"/>
      
      <circle cx="172" cy="142" r="12"/>
      <circle cx="114" cy="215" r="12"/>
      <circle cx="428" cy="142" r="12"/>
      <circle cx="486" cy="215" r="12"/>
    </g>

    <!-- Couple Embracing Silhouette in Middle (Clear & Distinct) -->
    <!-- Groom (Left Silhouette) -->
    <g fill="#C5A059" fill-opacity="0.16" stroke="url(#wmGoldBalanced)" stroke-width="1.5">
      <circle cx="265" cy="226" r="15"/>
      <path d="M 265,241 C 255,265 240,315 235,385 C 230,455 225,555 220,635 L 285,635 C 285,545 280,445 280,385 C 280,325 275,265 265,241 Z"/>
      <path d="M 265,265 Q 290,285 315,290" fill="none" stroke-width="1.8"/>
    </g>

    <!-- Bride (Right Silhouette with Gown & Flowing Veil) -->
    <g fill="#C5A059" fill-opacity="0.16" stroke="url(#wmGoldBalanced)" stroke-width="1.5">
      <circle cx="330" cy="236" r="14"/>
      <circle cx="342" cy="231" r="5"/>

      <!-- Flowing Bridal Veil -->
      <path d="M 335,221 C 385,245 410,355 425,475 C 435,555 445,625 450,675" fill="none" stroke-width="1.3" stroke-dasharray="4 3"/>

      <!-- Wedding Dress Gown -->
      <path d="M 328,251 C 310,285 300,335 285,415 C 270,495 250,575 225,655 L 440,655 C 410,615 380,545 365,465 C 350,385 340,325 332,251 Z"/>
    </g>

    <!-- Romantic Heart Light behind Couple -->
    <path d="M 297,209 C 297,199 285,189 275,199 C 265,209 297,234 297,234 C 297,234 329,209 319,199 C 309,189 297,199 297,209 Z" fill="#C5A059" fill-opacity="0.2" stroke="url(#wmGoldBalanced)" stroke-width="1.2"/>

    <!-- Intertwined Gold Wedding Rings -->
    <g transform="translate(300, 740)">
      <circle cx="-19" cy="0" r="30" stroke-width="2.2" fill="url(#ringGlowBalanced)"/>
      <circle cx="19" cy="0" r="30" stroke-width="2.2" fill="url(#ringGlowBalanced)"/>
      <path d="M 19,-30 L 26,-39 L 19,-46 L 12,-39 Z" fill="url(#wmGoldBalanced)"/>
    </g>

  </g>
</svg>
